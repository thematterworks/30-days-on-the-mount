# XcodeGen spec for the 30 Days on the Mount iOS app. The .xcodeproj is
# generated from this file and not committed — edit here, then run:
#   cd ios && xcodegen generate
name: Mount
options:
  bundleIdPrefix: com.thematterworks
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Spoken conversations with your companion (Features/Voice). Pinned to a release
  # that has been out a while; v4 changed the API.
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    exactVersion: 3.4.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone and iPad.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Automatic signing under The Matterworks team, so Xcode provisions the
    # App Group, push and Live Activity entitlements for device builds.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LUX5PGSCA8

targets:
  Mount:
    type: application
    platform: iOS
    sources:
      - path: Mount
      - path: Shared
    info:
      path: Mount/Info.plist
      properties:
        # Home-screen label. "30 Days on the Mount" truncates there; the App
        # Store name stays the full brand (it is set in App Store Connect).
        CFBundleDisplayName: On the Mount
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad windows can be any shape and any way up.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Speak a reflection, a message to your companion, or talk with your companion out loud.
        NSSpeechRecognitionUsageDescription: Your spoken words are turned into text on this iPhone, so you can speak a reflection instead of typing it.
        UIBackgroundModes: [remote-notification, audio]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.thematterworks.mount
            CFBundleURLSchemes: [mount]
    entitlements:
      path: Mount/Mount.entitlements
      properties:
        com.apple.security.application-groups: [group.com.thematterworks.mount]
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thematterworks.mount
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MountWidgets
      - target: MountWatch
      - package: ElevenLabs

  MountWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MountWidgets
      - path: Shared
    info:
      path: MountWidgets/Info.plist
      properties:
        CFBundleDisplayName: On the Mount
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MountWidgets/MountWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.thematterworks.mount]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thematterworks.mount.widgets

  # The Apple Watch app: today's day and three breaths, fed by the iPhone
  # (Mount/Core/WatchBridge.swift). Embedded in the iPhone app.
  MountWatch:
    type: application
    platform: watchOS
    sources:
      - path: MountWatch
      - path: Shared/JourneySnapshot.swift
      - path: Shared/Zoe.swift
    info:
      path: MountWatch/Info.plist
      properties:
        CFBundleDisplayName: On the Mount
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thematterworks.mount
    entitlements:
      path: MountWatch/MountWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.thematterworks.mount]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thematterworks.mount.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: MountWatchWidgets

  # The watch-face complication.
  MountWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: MountWatchWidgets
      - path: Shared/JourneySnapshot.swift
      - path: Shared/Zoe.swift
    info:
      path: MountWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: On the Mount
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MountWatchWidgets/MountWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.thematterworks.mount]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thematterworks.mount.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"

  MountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MountTests
    dependencies:
      - target: Mount
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thematterworks.mount.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mount.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mount"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Mount:
    build:
      targets:
        Mount: all
        MountWidgets: all
    test:
      targets: [MountTests]
